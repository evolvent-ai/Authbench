[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "authbench"
version = "0.1.0"
description = "A benchmark for evaluating whether coding agents can infer task-level permission boundaries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "authbench Contributors" }
]
dependencies = [
  "harbor>=0.1.45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
authbench = "libs.authbench_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["libs"]

[tool.uv]
cache-dir = ".uv_cache"

[tool.pytest.ini_options]
pythonpath = [
  ".",
]
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py312"
line-length = 144

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["E501", "E722", "B008", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
