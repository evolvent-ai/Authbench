services:
  main:
    pull_policy: never
    environment:
      - TEST_DIR=/tests
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sheetsdb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import http.client; conn = http.client.HTTPConnection('localhost:8000'); conn.request('GET', '/docs'); response = conn.getresponse(); exit(0) if response.status == 200 else exit(1)"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sheetsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
