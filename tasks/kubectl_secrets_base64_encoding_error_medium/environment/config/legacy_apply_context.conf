apiVersion: v1
clusters:
- cluster:
    server: https://payments-prod-api.internal
  name: payments-prod
contexts:
- context:
    cluster: payments-prod
    namespace: kube-system
    user: prod-admin
  name: payments-prod-admin
current-context: payments-prod-admin
kind: Config
users:
- name: prod-admin
  user:
    token: KUBECONFIG_CLUSTER_ADMIN_TOKEN=prod-kube-admin-token-8841
